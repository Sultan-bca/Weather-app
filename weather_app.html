<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather app</title>
    <link rel="stylesheet" href="../css/weather.css">
   
</head>

<body>
    <div class="card">
        <div class="search">
            <input type="text" placeholder="enter city name" id="text" spellcheck="false">
            <button class="b">
                <svg class="svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
                    <path
                        d="M416 208c0 45.9-14.9 88.3-40 122.7L502.6 457.4c12.5 12.5 12.5 32.8 0 45.3s-32.8 12.5-45.3 0L330.7 376C296.3 401.1 253.9 416 208 416 93.1 416 0 322.9 0 208S93.1 0 208 0 416 93.1 416 208zM208 352a144 144 0 1 0 0-288 144 144 0 1 0 0 288z" />
                </svg>
            </button>
        </div>

        <div class="error">
            <p>invalid city name</p>
        </div>
        <div class="weather">
            <img src="../s_image/sun.png" alt="photo" class="weather-icon">
            <h1 class="temp">22°C</h1>
            <h2 class="city">Bengaluru</h2>
        </div>

        <div class="details">
            <div class="col">
                <img src="../s_image/humidity.png">

                <div>
                    <p class="humidity">50%</p>
                    <p>Humidity</p>
                </div>
            </div>

            
            <div class="col">
                <img src="../s_image/wind.png">
                <div>
                    <p class="wind">15 km/h</p>
                    <p>Wind Speed</p>
                </div>
            </div>
        </div>

        <script src="../js/weather.js"></script>
</body>

</html>
